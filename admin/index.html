<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0B5590">
<title>لوحة تحكم الموقع — ATTARIX</title>
<link rel="icon" href="/brand/attarix-mark-square-32.png" type="image/png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/admin.css">
<script src="/admin/admin.js" defer></script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <img src="/brand/attarix-mark-h108.png" alt="" width="34" height="29">
    <h1>لوحة تحكم الموقع</h1>
    <button type="button" id="themeBtn" aria-label="الوضع الفاتح أو الداكن">◐</button>
    <button type="button" id="logoutBtn" hidden>خروج</button>
  </div>
</header>

<main class="wrap">
  <noscript><p class="msg err">اللوحة محتاجة JavaScript شغّال في المتصفح.</p></noscript>

  <section id="loginView" class="card login" hidden>
    <h2>تسجيل الدخول</h2>
    <p>اكتب كلمة السر، والكود المكوّن من 6 أرقام من تطبيق Google Authenticator.</p>
    <form id="loginForm" autocomplete="on">
      <input type="text" name="username" autocomplete="username" value="owner" hidden>
      <label class="f"><span>كلمة السر</span>
        <input type="password" id="password" name="password" autocomplete="current-password" required maxlength="256">
      </label>
      <label class="f"><span>الكود (6 أرقام)</span>
        <input type="text" id="totp" name="totp" class="code-input" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9٠-٩]{6}" maxlength="6" required>
      </label>
      <button type="submit" class="btn btn-primary btn-block" id="loginBtn">دخول</button>
      <p id="loginMsg" class="msg err" hidden></p>
    </form>
  </section>

  <section id="loadingView"><p class="hint">جاري التحميل…</p></section>

  <section id="editorView" hidden>
    <div id="sourceNote" class="hint"></div>
    <div id="errors" class="errors" hidden></div>
    <div id="panels"></div>
  </section>
</main>

<div class="bar" id="actionBar" hidden>
  <div class="wrap">
    <div class="actions">
      <button type="button" class="btn btn-primary" id="saveBtn">حفظ في المعاينة</button>
      <button type="button" class="btn" id="previewBtn">فتح المعاينة</button>
      <button type="button" class="btn btn-cta" id="publishBtn">نشر</button>
      <button type="button" class="btn btn-danger" id="rollbackBtn">تراجع</button>
    </div>
    <p class="status" id="status" role="status" aria-live="polite"></p>
  </div>
</div>

<dialog id="confirmDialog">
  <form method="dialog">
    <div class="d-body">
      <h3 id="confirmTitle"></h3>
      <p id="confirmText"></p>
    </div>
    <div class="d-actions">
      <button value="yes" class="btn btn-primary" id="confirmYes"></button>
      <button value="no" class="btn">رجوع</button>
    </div>
  </form>
</dialog>
</body>
</html>
